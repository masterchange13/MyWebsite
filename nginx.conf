server {
    listen 80;
    server_name _;   # 替换为你的域名，如 masterchange.natapp1.cc

    # 上传文件大小限制
    client_max_body_size 100M;

    # 前端静态文件目录 — 替换为实际的 dist 路径
    root /home/mao/code/web/MyWebsite/dist;
    index index.html;

    # gzip 压缩（移动端加载更快）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
    gzip_vary on;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /icon/ {
        expires 7d;
    }
    location ~* \.(ico|png|jpg|jpeg|gif|svg)$ {
        expires 7d;
    }

    # Django API 代理（去掉 /api 前缀）
    # 请求 /api/users/login → 后端 /users/login
    location /api/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # Chat WebSocket 代理
    location /chat/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由 — 所有不是文件的请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
